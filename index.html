<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVVA Insights · Sign In</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 55%,#4c1d95 100%);
  color:#e2e8f0;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.card{
  width:min(440px,100%);
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:44px 40px;
  box-shadow:0 30px 60px rgba(0,0,0,0.4);
  text-align:center;
}
.brand{font-size:44px;letter-spacing:.22em;font-weight:300;line-height:.9}
.brand small{display:block;font-size:11px;letter-spacing:.5em;font-weight:700;margin-top:10px;color:#a78bfa}
.tagline{font-size:13px;color:#94a3b8;margin:22px 0 8px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#334155,transparent);margin:28px 0}
.signin-btn{
  display:inline-block;width:100%;
  background:linear-gradient(135deg,#7c3aed,#4f25d8);
  color:#fff;text-decoration:none;
  padding:14px;border-radius:11px;
  font-weight:600;letter-spacing:.03em;font-size:14px;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 8px 24px rgba(124,58,237,0.4);
}
.signin-btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(124,58,237,0.5)}
.foot{margin-top:30px;font-size:11px;color:#64748b;line-height:1.6}
.foot b{color:#94a3b8}
.pulse{display:inline-block;width:6px;height:6px;background:#22c55e;border-radius:50%;margin-right:6px;animation:pulse 1.5s infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">AVVA<small>INSIGHTS</small></div>
  <p class="tagline">Adaptive visibility for institutions driving change.</p>
  <div class="divider"></div>
  <a class="signin-btn" href="login.html">Sign in to your workspace →</a>
  <div class="foot">
    <p><span class="pulse"></span>System operational · 5 workspaces online</p>
    <p style="margin-top:14px"><b>Reemerge Group</b> · Making Invisible Markets Visible.</p>
    <p style="margin-top:6px">© 2026 Reemerge Group. All rights reserved.</p>
  </div>
</div>
</body>
</html>
