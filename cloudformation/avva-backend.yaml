AWSTemplateFormatVersion: '2010-09-09'
Description: AVVA Insights Backend - DynamoDB + Lambda + API Gateway

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret key for signing JWT tokens. Use a long random string.
    MinLength: 32

Resources:

  # ==================== DYNAMODB TABLES ====================

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub avva-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WorkspacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub avva-workspaces-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: ownerEmail
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - AttributeName: ownerEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProgrammesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub avva-programmes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: workspaceId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: workspaceId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub avva-audit-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ==================== IAM ROLE ====================

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub avva-api-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AvvaDynamoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt WorkspacesTable.Arn
                  - !GetAtt ProgrammesTable.Arn
                  - !GetAtt AuditTable.Arn
                  - !Sub ${WorkspacesTable.Arn}/index/*
                  - !Sub ${ProgrammesTable.Arn}/index/*

  # ==================== LAMBDA FUNCTION ====================

  ApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub avva-api-${Environment}
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          WORKSPACES_TABLE: !Ref WorkspacesTable
          PROGRAMMES_TABLE: !Ref ProgrammesTable
          AUDIT_TABLE: !Ref AuditTable
          JWT_SECRET: !Ref JwtSecret
          AI_PROVIDER: openai
          AI_API_KEY: ""
          AI_MODEL: gpt-4o-mini
          ALLOWED_ORIGINS: "*"
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 500,
                  "body": "Placeholder — deploy the real code from lambda/api/index.py"
              }

  # ==================== API GATEWAY ====================

  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub avva-api-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambda.Arn}/invocations
      PayloadFormatVersion: '2.0'

  ApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: $default
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: $default
      AutoDeploy: true

    LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*
Outputs:
  ApiEndpoint:
    Description: Your API Gateway endpoint
    Value: !GetAtt ApiGateway.ApiEndpoint
  UsersTable:
    Value: !Ref UsersTable
  WorkspacesTable:
    Value: !Ref WorkspacesTable
  ProgrammesTable:
    Value: !Ref ProgrammesTable
  AuditTable:
    Value: !Ref AuditTable
